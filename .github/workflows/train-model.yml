name: Train tiny Transformer artifact

on:
  push:
    branches: [main]
    paths:
      - scripts/train_tiny_transformer.py
      - .github/workflows/train-model.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: train-tiny-transformer
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Train and evaluate
        run: python scripts/train_tiny_transformer.py
      - name: Commit learned artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/model/tiny-transformer.json docs/learned-model.md
          if git diff --cached --quiet; then
            echo "No model artifact changes"
          else
            git commit -m "model: update learned tiny transformer artifact"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
