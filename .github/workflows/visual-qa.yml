name: Verify published CartPole release (one-off)

on:
  push:
    branches: [fix/published-verification-20260920]
    paths: [.github/workflows/visual-qa.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lab: ppo
            repository: tinmanlab/cartpole-ppo
            source: 0914a0c1e1180066cc5156e61b883f6461065cbe
            url: https://tinmanlab.github.io/cartpole-ppo/
            node: '22'
          - lab: transformer
            repository: tinmanlab/cartpole-transformer
            source: 4181f079d6c32feff160fa5d60acdafc91b0bc4c
            url: https://tinmanlab.github.io/cartpole-transformer/
            node: '24'
          - lab: diffusion
            repository: tinmanlab/cartpole-diffusion
            source: bb78d39a0f04c07ee0f01bef0dac3907507e7eb7
            url: https://tinmanlab.github.io/cartpole-diffusion/
            node: '24'
    env:
      QA_URL: ${{ matrix.url }}
      EXPECTED_SOURCE: ${{ matrix.source }}
      LAB: ${{ matrix.lab }}
    steps:
      - name: Read the exact merged source, not the verification branch
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build the exact Transformer release
        if: matrix.lab == 'transformer'
        run: |
          npm ci
          npm run check:model
          npm run check:vision
          npm run check:fusion
          npm run check:comparison
          npm run check:dynamics
          npm run build
      - name: Build the exact PPO release
        if: matrix.lab == 'ppo'
        run: |
          node tools/test.js
          python src/build.py
          python src/build.py --check
          python tools/check_package.py
          python tools/package_pages.py --revision "$EXPECTED_SOURCE"
          python -m pip install -r requirements-dev.txt
          google-chrome --version
      - name: Prepare existing JavaScript browser tests
        if: matrix.lab != 'ppo'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Match deployed application bytes to the merged source
        run: |
          mkdir -p qa-output
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess, time, urllib.request
          lab = os.environ['LAB']
          source = os.environ['EXPECTED_SOURCE']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != source:
              raise SystemExit('Checked-out source does not match expected merge')
          root = pathlib.Path('dist' if lab == 'transformer' else '_site' if lab == 'ppo' else '.')
          if lab == 'transformer':
              files = sorted(p for p in root.rglob('*') if p.is_file())
          elif lab == 'ppo':
              files = [root / 'index.html', root / 'viewer.ko.html']
          else:
              files = [root / 'index.html'] + sorted((root / 'app').glob('*.js')) + sorted((root / 'artifacts').glob('*.json'))
          report = {'lab': lab, 'source': source, 'url': os.environ['QA_URL'], 'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'files': []}
          for path in files:
              rel = path.relative_to(root).as_posix()
              expected = hashlib.sha256(path.read_bytes()).hexdigest()
              url = os.environ['QA_URL'] + rel
              got = None
              error = None
              for attempt in range(6):
                  try:
                      req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          got = hashlib.sha256(response.read()).hexdigest()
                      if got == expected:
                          break
                      error = 'deployed bytes differ'
                  except Exception as exc:
                      error = str(exc)
                  if attempt < 5:
                      time.sleep(5)
              row = {'path': rel, 'expectedSHA256': expected, 'deployedSHA256': got, 'match': got == expected}
              if got != expected:
                  row['error'] = error
              report['files'].append(row)
              print(json.dumps(row), flush=True)
          report['passed'] = bool(report['files']) and all(x['match'] for x in report['files'])
          pathlib.Path('qa-output/public-identity.json').write_text(json.dumps(report, indent=2))
          if not report['passed']:
              raise SystemExit('Public release identity check failed')
          PY
      - name: Exercise the public PPO URL using existing tests
        if: matrix.lab == 'ppo'
        env:
          BROWSER_CHANNEL: chrome
        run: |
          python tests/test_pages_live.py --base-url "$QA_URL" --expected-revision "$EXPECTED_SOURCE" --wait-seconds 45 --output qa-output/pages
          python tests/test_tip_browser.py --base-url "$QA_URL" --output qa-output/tip
          python tests/test_robust_browser.py --base-url "$QA_URL" --output qa-output/robust
          python tests/test_responsive_browser.py --base-url "$QA_URL" --output qa-output/responsive
          python tests/test_follow_experience_browser.py --base-url "$QA_URL" --output qa-output/follow-experience
      - name: Exercise the public Transformer URL using its unchanged suite
        if: matrix.lab == 'transformer'
        run: node scripts/visual_qa.mjs
      - name: Exercise the public Diffusion URL using its unchanged suite
        if: matrix.lab == 'diffusion'
        run: node tests/visual_qa.mjs
      - name: Capture the published Transformer guide and check exactly-once execution
        if: matrix.lab == 'transformer'
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser = await chromium.launch({headless:true});
          try {
            for (const width of [320,390,768,1024,1440]) {
              const page = await browser.newPage({viewport:{width,height:1000},reducedMotion:'reduce'});
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              await page.goto(process.env.QA_URL,{waitUntil:'networkidle',timeout:60000});
              await page.getByRole('button',{name:'Reset',exact:true}).click();
              await page.getByRole('button',{name:'한 판단 따라가기 · Follow one decision',exact:true}).click();
              const before=Number(await page.locator('main').getAttribute('data-sync-tick'));
              const input=await page.locator('.fd-values').innerText();
              await page.getByRole('tab',{name:'Result · 결과',exact:true}).click();
              await page.locator('.fd-apply').evaluate(e=>{e.click();e.click();});
              await page.locator('.fd-result-summary').waitFor();
              assert.equal(Number(await page.locator('main').getAttribute('data-sync-tick')),before+1);
              assert.equal(await page.locator('.fd-details').evaluate(e=>e.open),false);
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1),false);
              if(width===320||width===1440) await page.locator('.follow-decision-guide').screenshot({path:`qa-output/published-guide-${width}.png`});
              await page.getByRole('tab',{name:'Input · 입력',exact:true}).click();
              assert.equal(await page.locator('.fd-values').innerText(),input);
              assert.deepEqual(errors,[]);
              console.log(`PUBLISHED_GUIDE_OK width=${width} tick=${before}->${before+1}`);
              await page.close();
            }
          } finally {await browser.close();}
          JS
      - name: Keep public-origin evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-${{ matrix.lab }}-${{ matrix.source }}
          path: qa-output/
          retention-days: 30
          if-no-files-found: error
