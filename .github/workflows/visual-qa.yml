name: Visual QA

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**', 'feat/**']
    paths:
      - "src/**"
      - "public/model/**"
      - "scripts/visual_qa.mjs"
      - "scripts/check_*.mjs"
      - ".github/workflows/visual-qa.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/model/**"
      - "scripts/visual_qa.mjs"
      - "scripts/check_*.mjs"
      - ".github/workflows/visual-qa.yml"

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0-chromium
      - name: Prepare browser QA
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: npm run check:model
      - run: npm run check:toy-attention
      - run: npm run check:vision
      - run: npm run check:fusion
      - run: npm run check:comparison
      - run: npm run check:dynamics
      - run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/cartpole-preview.log 2>&1 &
          echo $! > /tmp/cartpole-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/cartpole-transformer/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cartpole-preview.log
          exit 1
      - name: Run visual and interaction QA
        run: node scripts/visual_qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa
          path: qa-output/
          retention-days: 14
      - name: Upload candidate build for PR review
        # Lets a reviewer download and preview the exact built output for this
        # PR without a deploy step; only after a fully green build + QA run.
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist-preview
          path: dist/
          retention-days: 14
  publish:
    # Separate job so only this one narrow, main-only, post-success publisher
    # gets contents:write; the qa job (which also runs on untrusted PRs) stays
    # read-only.
    needs: qa
    if: needs.qa.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: visual-qa
          path: qa-output
      - name: Publish latest visual QA snapshot
        # Only a fully green run on main is allowed to overwrite the last
        # known-good snapshot; failing runs and PR runs must never touch it.
        run: |
          if [ ! -f qa-output/report.json ]; then
            echo "No completed QA report; preserving last known-good qa-visual snapshot"
            exit 0
          fi

          mkdir -p /tmp/qa-export
          cp qa-output/report.json /tmp/qa-export/report.json
          shopt -s nullglob
          for f in qa-output/*.jpg; do
            base64 -w0 "$f" > "/tmp/qa-export/$(basename "$f").b64"
          done

          git fetch origin qa-visual
          git worktree add /tmp/cartpole-qa origin/qa-visual
          mkdir -p /tmp/cartpole-qa/qa/latest
          rm -f /tmp/cartpole-qa/qa/latest/*
          cp /tmp/qa-export/* /tmp/cartpole-qa/qa/latest/
          cd /tmp/cartpole-qa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/latest
          if ! git diff --cached --quiet; then
            git commit -m "qa: update visual browser snapshot"
            for attempt in 1 2 3; do
              git pull --rebase origin qa-visual
              if git push origin HEAD:qa-visual; then
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
