name: Verify published PPO release (browser setup repair)

on:
  push:
    branches: [fix/published-verification-20260920]
    paths: [.github/workflows/visual-qa.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-ppo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_URL: https://tinmanlab.github.io/cartpole-ppo/
      EXPECTED_SOURCE: 0914a0c1e1180066cc5156e61b883f6461065cbe
      BROWSER_CHANNEL: chrome
    steps:
      - name: Read the exact merged PPO source
        uses: actions/checkout@v4
        with:
          repository: tinmanlab/cartpole-ppo
          ref: 0914a0c1e1180066cc5156e61b883f6461065cbe
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and prepare both browser launch paths used by the existing tests
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node tools/test.js
          python src/build.py
          python src/build.py --check
          python tools/check_package.py
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          google-chrome --version
      - name: Match public application bytes to the exact source
        run: |
          mkdir -p qa-output
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib, urllib.request
          report = {'lab': 'ppo', 'source': os.environ['EXPECTED_SOURCE'], 'url': os.environ['QA_URL'], 'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'files': []}
          for name in ('index.html', 'viewer.ko.html'):
              expected = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              req = urllib.request.Request(os.environ['QA_URL'] + name, headers={'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  actual = hashlib.sha256(response.read()).hexdigest()
              row = {'path': name, 'expectedSHA256': expected, 'deployedSHA256': actual, 'match': actual == expected}
              report['files'].append(row)
              print(json.dumps(row), flush=True)
          report['passed'] = all(row['match'] for row in report['files'])
          pathlib.Path('qa-output/public-identity.json').write_text(json.dumps(report, indent=2))
          if not report['passed']:
              raise SystemExit('Public release identity check failed')
          PY
      - name: Exercise the actual published URL, including the new guide
        run: |
          python tests/test_pages_live.py --base-url "$QA_URL" --expected-revision "$EXPECTED_SOURCE" --wait-seconds 45 --output qa-output/pages
          python tests/test_tip_browser.py --base-url "$QA_URL" --output qa-output/tip
          python tests/test_robust_browser.py --base-url "$QA_URL" --output qa-output/robust
          python tests/test_responsive_browser.py --base-url "$QA_URL" --output qa-output/responsive
          python tests/test_follow_experience_browser.py --base-url "$QA_URL" --output qa-output/follow-experience
      - name: Keep actual public-origin evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-ppo-0914a0c1e1180066cc5156e61b883f6461065cbe
          path: qa-output/
          retention-days: 30
          if-no-files-found: error
