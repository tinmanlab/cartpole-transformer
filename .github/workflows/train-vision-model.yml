name: Train vision-only Transformer

on:
  push:
    branches: [feat/vision-only-v03]
    paths:
      - scripts/train_vision_transformer.py
      - .github/workflows/train-vision-model.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: train-vision-transformer
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic CPU stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Train and evaluate visual policy
        run: python scripts/train_vision_transformer.py
      - name: Commit vision artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/model/vision-transformer.json docs/vision-model.md
          if git diff --cached --quiet; then
            echo "No vision artifact changes"
          else
            git commit -m "vision: update trained pixels-only model artifact"
            git fetch origin feat/vision-only-v03
            git rebase origin/feat/vision-only-v03
            git push origin HEAD:feat/vision-only-v03
          fi
